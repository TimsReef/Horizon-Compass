name: Android APK Build (No EAS)
on:
  # Specify when you want the build to run here
  push:
    # Sequence of patterns matched against refs/tags
    tags:
      - 'release-*' # Matches tags starting with 'release-'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Required to create/update releases
      packages: write    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4.0.2
        with:
          node-version: '25.x'
          cache: 'npm'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17' # Required for modern Android/Expo builds
          
      - name: Install Dependencies
        run: npm install

      - name: Prebuild Android
        # Generates the /android directory without using EAS
        run: npx expo prebuild --platform android --no-install

      - name: Build Release APK
        # Runs the native Gradle build command
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace
      
      - name: Upload APK to Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: android/app/build/outputs/apk/release/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
