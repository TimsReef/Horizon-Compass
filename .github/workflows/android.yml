name: Android APK Build (No EAS)
on:
  # Specify when you want the build to run here
  push:
    # Sequence of patterns matched against refs/tags
    tags:
      - 'release-*' # Matches tags starting with 'release-'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Required to create/update releases
      packages: write    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4.0.2
        with:
          node-version: '25.x'
          cache: 'npm'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17' # Required for modern Android/Expo builds
          
      - name: Install Dependencies
        run: npm install

      - name: Prebuild Android
        # Generates the /android directory without using EAS
        run: npx expo prebuild --platform android --no-install

      - name: Build Release APK
        # Runs the native Gradle build command
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace
      
      - name: Rename and Prepare APK
        id: rename_apk
        run: |
          # 1. Extract app name and version from app.json
          # tr -dc '[:alnum:]' removes spaces and special characters for a safe filename
          APP_NAME=$(jq -r '.expo.name' app.json | tr -dc '[:alnum:]\n\r')
          VERSION=$(jq -r '.expo.version' app.json)
          NEW_FILENAME="${APP_NAME}-v${VERSION}.apk"

          # 2. Find the generated APK (handles name variations like 'app-release-unsigned.apk')
          ORIGINAL_APK=$(ls android/app/build/outputs/apk/release/*.apk | head -n 1)
          
          # 3. Move/Rename the APK to the root workspace for easy access
          mv "$ORIGINAL_APK" "$NEW_FILENAME"
          
          # 4. Save the filename to the environment for the next step
          echo "APK_FILENAME=$NEW_FILENAME" >> $GITHUB_ENV
          echo "Created APK: $NEW_FILENAME"

      - name: Upload APK to Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          # Uses the environment variable from the previous step
          files: ${{ env.APK_FILENAME }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
