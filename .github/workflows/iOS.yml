name: iOS IPA Build (No EAS)
on:
  # Specify when you want the build to run here
  push:
    # Sequence of patterns matched against refs/tags
    tags:
      - 'release-*' # Matches tags starting with 'release-'

jobs:
  build_ios:
    runs-on: macos-latest # Required for Xcode
    permissions:
      contents: write  # Required to create/update releases
      packages: write    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '25.x'
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Prebuild iOS
        # Generates the /ios directory
        run: |
          # Force a clean prebuild to pick up the bundleIdentifier
          rm -rf ios        
          npx expo prebuild --platform ios --no-install
          ls ios/*.xcodeproj

      - name: Install CocoaPods
        run: |
          cd ios
          pod install

      - name: Build and Packge
        run: |
          # 1. Detect Workspace and Scheme
          WORKSPACE_PATH=$(ls -d ios/*.xcworkspace | head -n 1)
          SCHEME_NAME=$(xcodebuild -workspace "$WORKSPACE_PATH" -list | grep -A 10 "Schemes:" | grep -v "Schemes:" | grep -v "Pods-" | grep -v "EXConstants" | head -n 1 | xargs)
          
          echo "Building Scheme: $SCHEME_NAME"

          # 2. Use 'build' instead of 'archive' to bypass signing restrictions
          # SYMROOT forces the output into our local ios/build folder
          xcodebuild build -workspace "$WORKSPACE_PATH" \
            -scheme "$SCHEME_NAME" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath ios/build \
            SYMROOT=$(pwd)/ios/build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_ENTITLEMENTS="" \
            CODE_SIGNING_IDENTITY=""

      - name: Package Unsigned IPA
        run: |
          # 1. Generate filename from app.json
          APP_NAME=$(jq -r '.expo.name' app.json | tr -dc '[:alnum:]\n\r')
          VERSION=$(jq -r '.expo.version' app.json)
          FILENAME="${APP_NAME}-v${VERSION}.ipa"

          # 2. Find the .app folder in the Release-iphoneos directory
          # We use a broad find to ensure we catch it regardless of the subfolder structure
          APP_PATH=$(find ios/build -name "*.app" -type d | grep "Release-iphoneos" | head -n 1)
          
          if [ -z "$APP_PATH" ]; then
            echo "❌ Error: .app file not found. Listing build directory for debug:"
            find ios/build -maxdepth 5
            exit 1
          fi

          echo "Found .app at: $APP_PATH"

          # 3. Create IPA structure (The 'Payload' folder is mandatory for iOS)
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          zip -r "$FILENAME" Payload
          
          # 4. Export filename for the Release step
          echo "IPA_FILENAME=$FILENAME" >> $GITHUB_ENV
          echo "Successfully created $FILENAME"

      - name: Upload Renamed IPA to Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          # Use the environment variable we just created
          files: ${{ env.IPA_FILENAME }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
