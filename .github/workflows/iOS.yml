name: iOS IPA Build (No EAS)
on:
  # Specify when you want the build to run here
  push:
    # Sequence of patterns matched against refs/tags
    tags:
      - 'release-*' # Matches tags starting with 'release-'

jobs:
  build_ios:
    runs-on: macos-latest # Required for Xcode
    permissions:
      contents: write  # Required to create/update releases
      packages: write    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '25.x'
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Prebuild iOS
        # Generates the /ios directory
        run: |
          npx expo prebuild --platform ios --no-install
          ls ios/*.xcodeproj

      - name: Install CocoaPods
        run: |
          cd ios
          pod install

      - name: Build and Archive
        run: |
          # 1. Find the workspace directory properly using -d (directory only)
          WORKSPACE_PATH=$(ls -d ios/*.xcworkspace | head -n 1)
          echo "Found Workspace: $WORKSPACE_PATH"
      
          # 2. Extract the Scheme name
          # We filter out 'EXConstants' and 'Pods' to ensure we get the main app scheme
          SCHEME_NAME=$(xcodebuild -workspace "$WORKSPACE_PATH" -list | grep -A 10 "Schemes:" | grep -v "Schemes:" | grep -v "Pods-" | grep -v "EXConstants" | head -n 1 | xargs)
          echo "Detected Scheme: $SCHEME_NAME"
      
          # 3. Run the build
          xcodebuild -workspace "$WORKSPACE_PATH" \
            -scheme "$SCHEME_NAME" \
            -configuration Release \
            -archivePath ios/build/project.xcarchive \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_ENTITLEMENTS="" \
            CODE_SIGNING_IDENTITY=""

      - name: Create Unsigned IPA
        run: |
          # 1. Create the Payload directory (required for IPA structure)
          mkdir -p Payload
          
          # 2. Find the .app folder inside the archive using a wildcard path
          # This handles both 'project.xcarchive' and 'App.xcarchive'
          APP_PATH=$(ls -d ios/build/*.xcarchive/Products/Applications/*.app | head -n 1)
          echo "Found .app at: $APP_PATH"
          
          # 3. Copy the .app folder into the Payload directory
          cp -r "$APP_PATH" Payload/
          
          # 4. Zip the Payload directory into the IPA file
          zip -r app-release.ipa Payload
          
          # 5. Clean up
          rm -rf Payload          

      - name: Upload IPA to Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: ios-release
          files: app-release.ipa
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
