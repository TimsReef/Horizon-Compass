name: iOS IPA Build (No EAS)
on:
  # Specify when you want the build to run here
  push:
    # Sequence of patterns matched against refs/tags
    tags:
      - 'release-*' # Matches tags starting with 'release-'

jobs:
  build_ios:
    runs-on: macos-latest # Required for Xcode
    permissions:
      contents: write  # Required to create/update releases
      packages: write    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '25.x'
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Prebuild iOS
        # Generates the /ios directory
        run: |
          # Force a clean prebuild to pick up the bundleIdentifier
          rm -rf ios        
          npx expo prebuild --platform ios --no-install
          ls ios/*.xcodeproj

      - name: Install CocoaPods
        run: |
          cd ios
          pod install

      - name: Build Unsigned App
        run: |
          WORKSPACE_PATH=$(ls -d ios/*.xcworkspace | head -n 1)
          
          # 1. Specifically look for the 'project' scheme or the one matching your slug
          # If 'project' isn't found, it falls back to the first non-library scheme
          SLUG=$(jq -r '.expo.slug' app.json)
          SCHEME_NAME=$(xcodebuild -workspace "$WORKSPACE_PATH" -list | grep -E "project|$SLUG" | head -n 1 | xargs)
          
          # Fallback if the above fails
          if [ -z "$SCHEME_NAME" ]; then
            SCHEME_NAME=$(xcodebuild -workspace "$WORKSPACE_PATH" -list | grep -A 10 "Schemes:" | grep -v "Schemes:" | grep -v "Pods-" | grep -v "EX" | grep -v "React" | head -n 1 | xargs)
          fi
          
          echo "Building Main App Scheme: $SCHEME_NAME"

          xcodebuild build -workspace "$WORKSPACE_PATH" \
            -scheme "$SCHEME_NAME" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath ios/build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_ENTITLEMENTS="" \
            CODE_SIGNING_IDENTITY="" \
            COMPILER_INDEX_STORE_ENABLE=NO

          # 3. DEBUG: List the entire archive structure to see where the .app went
          echo "--- Archive Structure ---"
          find ios/build/App.xcarchive -name "*.app" -type d || echo "No .app folders found in archive!"
          
          # 4. List the Products directory specifically
          echo "--- Products Directory ---"
          ls -R ios/build/App.xcarchive/Products || echo "Products directory is empty!"

      - name: Package Unsigned IPA
        run: |
          APP_NAME=$(jq -r '.expo.name' app.json | tr -dc '[:alnum:]\n\r')
          VERSION=$(jq -r '.expo.version' app.json)
          FILENAME="${APP_NAME}-v${VERSION}.ipa"

          # 2. Search deeper for the .app (it might be in a 'Build/Products' subfolder)
          APP_PATH=$(find ios/build -name "*.app" -type d | grep "Release-iphoneos" | head -n 1)
          
          if [ -z "$APP_PATH" ]; then
            echo "❌ Still no .app found. Listing ALL schemes found in project:"
            xcodebuild -workspace ios/*.xcworkspace -list
            exit 1
          fi

          echo "Found .app at: $APP_PATH"
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          zip -r "$FILENAME" Payload
          echo "IPA_FILENAME=$FILENAME" >> $GITHUB_ENV

      - name: Upload Renamed IPA to Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          # Use the environment variable we just created
          files: ${{ env.IPA_FILENAME }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
