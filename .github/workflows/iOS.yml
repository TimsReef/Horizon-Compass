name: iOS IPA Build (No EAS)
on:
  # Specify when you want the build to run here
  push:
    # Sequence of patterns matched against refs/tags
    tags:
      - 'release-*' # Matches tags starting with 'release-'

jobs:
  build_ios:
    runs-on: macos-latest # Required for Xcode
    permissions:
      contents: write  # Required to create/update releases
      packages: write    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '25.x'
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Prebuild iOS
        # Generates the /ios directory
        run: |
          npx expo prebuild --platform ios --no-install
          ls ios/*.xcodeproj

      - name: Install CocoaPods
        run: |
          cd ios
          pod install

      - name: Build and Archive
        run: |
          # 1. Find the workspace file (handles project.xcworkspace or HorizonCompassPro.xcworkspace)
          WORKSPACE_PATH=$(ls ios/*.xcworkspace | head -n 1)
          
          # 2. Extract the first valid scheme name from that workspace
          # This specifically looks for the line after "Schemes:"
          SCHEME_NAME=$(xcodebuild -workspace "$WORKSPACE_PATH" -list | grep -A 1 "Schemes:" | tail -n 1 | xargs)
          
          echo "Using Workspace: $WORKSPACE_PATH"
          echo "Using Detected Scheme: $SCHEME_NAME"
      
          # 3. Run the build with the detected names
          xcodebuild -workspace "$WORKSPACE_PATH" \
            -scheme "$SCHEME_NAME" \
            -configuration Release \
            -archivePath ios/build/project.xcarchive \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_ENTITLEMENTS="" \
            CODE_SIGNING_IDENTITY=""

      - name: Create Unsigned IPA
        # IPA is just a zipped .app folder in a Payload directory
        run: |
          mkdir -p Payload
          cp -r ios/build/project.xcarchive/Products/Applications/*.app Payload/
          zip -r app-release.ipa Payload
          rm -rf Payload

      - name: Upload IPA to Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: ios-release
          files: app-release.ipa
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
