name: iOS IPA Build (No EAS)
on:
  # Specify when you want the build to run here
  push:
    # Sequence of patterns matched against refs/tags
    tags:
      - 'release-*' # Matches tags starting with 'release-'

jobs:
  build_ios:
    runs-on: macos-latest # Required for Xcode
    permissions:
      contents: write  # Required to create/update releases
      packages: write    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '25.x'
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Prebuild iOS
        # Generates the /ios directory
        run: |
          npx expo prebuild --platform ios --no-install
          ls ios/*.xcodeproj

      - name: Install CocoaPods
        run: |
          cd ios
          pod install

      - name: Build and Archive
        run: |
          # 1. Find the workspace directory properly using -d (directory only)
          WORKSPACE_PATH=$(ls -d ios/*.xcworkspace | head -n 1)
          echo "Found Workspace: $WORKSPACE_PATH"
      
          # 2. Extract the Scheme name
          # We filter out 'EXConstants' and 'Pods' to ensure we get the main app scheme
          SCHEME_NAME=$(xcodebuild -workspace "$WORKSPACE_PATH" -list | grep -A 10 "Schemes:" | grep -v "Schemes:" | grep -v "Pods-" | grep -v "EXConstants" | head -n 1 | xargs)
          echo "Detected Scheme: $SCHEME_NAME"
      
          # 3. Run the build
          xcodebuild -workspace "$WORKSPACE_PATH" \
            -scheme "$SCHEME_NAME" \
            -configuration Release \
            -archivePath ios/build/App.xcarchive \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_ENTITLEMENTS="" \
            CODE_SIGNING_IDENTITY=""

      - name: Create and Rename Unsigned IPA
        run: |
          # 1. Extract app name and version from app.json
          # We use 'tr' to remove spaces and special characters for a clean filename
          APP_NAME=$(jq -r '.expo.name' app.json | tr -dc '[:alnum:]\n\r')
          VERSION=$(jq -r '.expo.version' app.json)
          FILENAME="${APP_NAME}-v${VERSION}.ipa"
          
          echo "Target Filename: $FILENAME"

          # 2. Package the IPA
          mkdir -p Payload
          APP_PATH=$(ls -d ios/build/*.xcarchive/Products/Applications/*.app | head -n 1)
          cp -r "$APP_PATH" Payload/
          zip -r "$FILENAME" Payload
          
          # 3. Store the filename for the next step
          echo "IPA_FILENAME=$FILENAME" >> $GITHUB_ENV
          rm -rf Payload

      - name: Upload Renamed IPA to Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          # Use the environment variable we just created
          files: ${{ env.IPA_FILENAME }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload IPA to Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: ios-release
          files: app-release.ipa
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
