name: iOS IPA Build (No EAS)
on:
  # Specify when you want the build to run here
  push:
    # Sequence of patterns matched against refs/tags
    tags:
      - 'release-*' # Matches tags starting with 'release-'

jobs:
  build_ios:
    runs-on: macos-latest # Required for Xcode
    permissions:
      contents: write  # Required to create/update releases
      packages: write    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '25.x'
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Prebuild iOS
        # Generates the /ios directory
        run: |
          npx expo prebuild --platform ios --no-install
          ls ios/*.xcodeproj
          xcodebuild -workspace ios/*.xcworkspace -list       

      - name: Install CocoaPods
        run: |
          cd ios
          pod install

      - name: Build and Archive
        run: |
          # This reads the slug from app.json and uses it as the scheme
          # Note: You may need to adjust based on how Expo named your specific project
          SLUG_NAME=$(cat app.json | jq -r '.expo.slug')
          echo "Detected Slug: $SLUG_NAME"
        
          # This finds the first valid scheme automatically
          SCHEME_NAME=$(xcodebuild -workspace ios/*.xcworkspace -list | grep -A 1 "Schemes:" | tail -n 1 | xargs)
          echo "Detected Scheme: $SCHEME_NAME"
        
          xcodebuild -workspace ios/*.xcworkspace \
            -scheme "$SCHEME_NAME" \
            -configuration Release \
            -archivePath ios/build/App.xcarchive \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_ENTITLEMENTS="" \
            CODE_SIGNING_IDENTITY=""

      - name: Create Unsigned IPA
        # IPA is just a zipped .app folder in a Payload directory
        run: |
          mkdir -p Payload
          cp -r ios/build/App.xcarchive/Products/Applications/*.app Payload/
          zip -r app-release.ipa Payload
          rm -rf Payload

      - name: Upload IPA to Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: ios-release
          files: app-release.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
