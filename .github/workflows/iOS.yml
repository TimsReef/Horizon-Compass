name: iOS IPA Build (No EAS)
on:
  # Specify when you want the build to run here
  push:
    # Sequence of patterns matched against refs/tags
    tags:
      - 'release-*' # Matches tags starting with 'release-'

jobs:
  build_ios:
    runs-on: macos-latest # Required for Xcode
    permissions:
      contents: write  # Required to create/update releases
      packages: write    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '25.x'
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Prebuild iOS
        # Generates the /ios directory
        run: |
          # Force a clean prebuild to pick up the bundleIdentifier
          rm -rf ios        
          npx expo prebuild --platform ios --no-install
          ls ios/*.xcodeproj

      - name: Install CocoaPods
        run: |
          cd ios
          pod install

      - name: Build Unsigned App
        id: xcode_build
        continue-on-error: true      
        run: |
          # This reads the slug from app.json and uses it as the scheme
          # Note: You may need to adjust based on how Expo named your specific project
          SLUG_NAME=$(cat app.json | jq -r '.expo.slug')
          echo "Detected Slug: $SLUG_NAME"
        
          # This finds the first valid scheme automatically
          SCHEME_NAME=$(xcodebuild -workspace ios/*.xcworkspace -list | grep -A 1 "Schemes:" | tail -n 1 | xargs)
          echo "Detected Scheme: $SCHEME_NAME" 
        
          # 1. We know the workspace and scheme from your log
          WORKSPACE="ios/HorizonCompassPro.xcworkspace"
          SCHEME="HorizonCompassPro"

          # Create a clean log file
          touch xcodebuild.log
          
          echo "Building Main App Scheme: $SCHEME"

          # 2. Build the app using 'build' action
          # We use -derivedDataPath to force the output into a predictable folder
          xcodebuild build -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath ios/build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_ENTITLEMENTS="" \
            CODE_SIGNING_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES | tee xcodebuild.log

      - name: Prepare XCode iOS Build Logs
        if: always()
        run: |
          APP_NAME=$(jq -r '.expo.name' app.json | tr -dc '[:alnum:]\n\r')
          VERSION=$(jq -r '.expo.version' app.json)
          LOG_FILENAME="${APP_NAME}-v${VERSION}-build-logs.txt"
          
          mv xcodebuild.log "$LOG_FILENAME"
          echo "LOG_FILENAME=$LOG_FILENAME" >> $GITHUB_ENV

      - name: Package Unsigned iOS IPA
        if: steps.xcode_build.outcome == 'success'
        run: |
          # 1. Extract naming info from app.json
          APP_NAME=$(jq -r '.expo.name' app.json | tr -dc '[:alnum:]\n\r')
          VERSION=$(jq -r '.expo.version' app.json)
          FILENAME="${APP_NAME}-v${VERSION}.ipa"

          # 2. Find the .app folder in the derived data path
          # It will be inside Build/Products/Release-iphoneos/
          APP_PATH=$(find ios/build/Build/Products/Release-iphoneos -name "*.app" -type d | head -n 1)
          
          if [ -z "$APP_PATH" ]; then
            echo "❌ Error: .app file not found. Listing build directory for debug:"
            find ios/build -maxdepth 5
            exit 1
          fi

          echo "Found .app at: $APP_PATH"

          # 3. Create the mandatory Payload folder and zip it
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          zip -r "$FILENAME" Payload
          
          # 4. Set environment variable for the Release upload step
          echo "IPA_FILENAME=$FILENAME" >> $GITHUB_ENV
          echo "Successfully created $FILENAME"

      - name: Upload Renamed IPA to Release
        uses: softprops/action-gh-release@v2
        if: always() && startsWith(github.ref, 'refs/tags/')
        with:
          # Use the environment variable we just created
          files: |
            ${{ env.IPA_FILENAME }}
            ${{ env.LOG_FILENAME }}
          generate_release_notes: true
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}      
